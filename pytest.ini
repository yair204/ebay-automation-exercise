[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts =
    -v
    --strict-markers
    --html=reports/report.html
    --self-contained-html
    --junitxml=reports/junit.xml
    --alluredir=reports/allure-results
markers =
    e2e: full end-to-end scenario against the live site
    unit: offline unit test, no browser required
    smoke: quick confidence check
log_cli = true
log_cli_level = INFO
